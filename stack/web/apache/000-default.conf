# Virtual host of the web image: static files from Apache, PHP through PHP-FPM on the loopback.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        # No folder listings. .htaccess files are honoured (Perfex ships one with its rewrite rules).
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000/"
    </FilesMatch>

    # Logs go to the container's stderr/stdout (docker logs, Portainer). Apache opens them as root at startup.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
