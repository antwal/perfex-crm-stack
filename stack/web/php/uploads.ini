; Upload and memory limits built into the web image (copied to conf.d/uploads.ini).
; To use other values, mount your own file at /usr/local/etc/php/conf.d/uploads.ini (the commented volume in
; stack/docker-compose.yml): same path, so your file replaces this one. Restart the web container to apply.
; memory_limit and max_execution_time are PHP's own defaults, written out so that the image states them: never set
; memory_limit below 128M, Perfex's PDF and export pages need it.
file_uploads = On
memory_limit = 128M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 30
