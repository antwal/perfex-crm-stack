<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The reference infrastructure of the template</title>
  <desc>Your machine reaches the web container over http and the tools container over ssh with a key. Both run in a Portainer stack on a Docker host and share /app, the application files; the tools container also holds /repo, a mirror of your code. MariaDB and an optional Mailpit already run on the same Docker network, outside the stack.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="196" y="40" width="444" height="320" rx="16" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="210" y="56" font-size="14" font-weight="500" fill="#B4B2A9">Docker host, one network: your machine resolves the container names</text>
  <rect x="206" y="66" width="276" height="278" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
  <text x="220" y="82" font-size="14" font-weight="500" fill="#B4B2A9">The stack, deployed from Portainer</text>
  <rect x="30" y="160" width="140" height="72" rx="8" fill="#2C2C2A" stroke="#888780" stroke-width="0.75"/>
  <text x="100" y="176" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">Your machine</text>
  <text x="100" y="196" font-size="12" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">http → web</text>
  <text x="100" y="216" font-size="12" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">ssh, key → tools</text>
  <rect x="220" y="92" width="160" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
  <text x="300" y="110" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">web</text>
  <text x="300" y="128" font-size="12" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">Apache + PHP-FPM</text>
  <rect x="220" y="276" width="160" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.75"/>
  <text x="300" y="294" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">tools</text>
  <text x="300" y="312" font-size="12" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">sshd, PHP, Composer</text>
  <rect x="220" y="186" width="120" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
  <text x="280" y="204" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">/app</text>
  <text x="280" y="222" font-size="12" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">Perfex files</text>
  <rect x="350" y="186" width="120" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
  <text x="410" y="204" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">/repo</text>
  <text x="410" y="222" font-size="12" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">code mirror</text>
  <rect x="500" y="92" width="128" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
  <text x="564" y="110" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">MariaDB</text>
  <text x="564" y="128" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">already there</text>
  <rect x="500" y="276" width="128" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
  <text x="564" y="294" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">Mailpit</text>
  <text x="564" y="312" font-size="12" fill="#5DCAA5" text-anchor="middle" dominant-baseline="central">optional</text>
  <g fill="none" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#a)">
    <path d="M170 184 L190 184 L190 120 L218 120"/>
    <path d="M170 208 L190 208 L190 304 L218 304"/>
    <path d="M280 148 L280 184"/>
    <path d="M280 276 L280 244"/>
    <path d="M365 276 L365 244"/>
    <path d="M380 110 L498 110"/>
    <path d="M380 136 L490 136 L490 304 L498 304"/>
  </g>
</svg>
